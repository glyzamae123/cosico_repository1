<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: linear-gradient(135deg, #0b63ce, #69b7ff);
            color: #183153;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: min(100%, 420px);
            padding: 40px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 20px 50px rgb(9 53 105 / 25%);
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: #e8f3ff;
            color: #1268d3;
            font-size: 25px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            margin: 10px 0 30px;
            color: #718096;
            text-align: center;
            font-size: 15px;
        }

        .field {
            margin-bottom: 19px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #d6e0ec;
            border-radius: 8px;
            outline: none;
            color: #183153;
            font: inherit;
        }

        .field input:focus {
            border-color: #1673df;
            box-shadow: 0 0 0 3px rgb(22 115 223 / 14%);
        }

        .form-options {
            margin: 3px 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #52647a;
        }

        .remember label {
            cursor: pointer;
        }

        a {
            color: #1268d3;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 8px;
            background: #1268d3;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover {
            background: #0d55b2;
        }

        button:focus-visible,
        a:focus-visible,
        .remember input:focus-visible {
            outline: 3px solid #80bdff;
            outline-offset: 3px;
        }

        .signup {
            margin: 24px 0 0;
            color: #718096;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">L</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to your account to continue</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <div class="form-options">
                <div class="remember">
                    <input id="remember" name="remember" type="checkbox">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Log In</button>
        </form>

        <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </main>
</body>
</html>
